name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python install --upgrade pip
          pip install -r requirements.txt
        
      - name: Lint with flake8
        run: flake8 processing/ ingestion/ --max-line-length=100 --exclude=__pycache__

      - name: Run unit tests
        run: pytest processing/transformations/test_transformations.py ingestion/lambda/test_handler_local.py -v --tb=short