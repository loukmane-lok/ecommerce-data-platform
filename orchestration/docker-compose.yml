services:
  postgres:
    image: postgres:13
    mem_limit: 512m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
  
  airflow-init:
    image: apache/airflow:2.8.0
    user:  "${AIRFLOW_UID}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command:
      - bash
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username ${AIRFLOW_ADMIN_USERNAME} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com \

  airflow-scheduler:
    image: apache/airflow:2.8.0
    user:  "${AIRFLOW_UID}:0"
    mem_limit: 1500m
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./glue_helpers.py:/opt/airflow/plugins/glue_helpers.py:ro
      - ../ingestion:/opt/ingestion:ro
      - ./logs:/opt/airflow/logs
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      LAMBDA_FUNCTION_NAME: ${LAMBDA_FUNCTION_NAME:-ecommerce-event-ingestion}
      RAW_BUCKET: ${RAW_BUCKET}
      RAW_BUCKET_NAME: ${RAW_BUCKET_NAME}
      CURATED_BUCKET: ${CURATED_BUCKET}
      GLUE_CRAWLER_NAME: ${GLUE_CRAWLER_NAME}
      GLUE_ETL_JOB: ${GLUE_ETL_JOB}
      GLUE_DQ_JOB: ${GLUE_DQ_JOB}
    env_file:
      - .env
  
  airflow-webserver:
    image: apache/airflow:2.8.0
    user:  "${AIRFLOW_UID}:0"
    mem_limit: 1000m
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-scheduler
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./glue_helpers.py:/opt/airflow/plugins/glue_helpers.py:ro
      - ../ingestion:/opt/ingestion:ro
      - ./logs:/opt/airflow/logs
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      LAMBDA_FUNCTION_NAME: ${LAMBDA_FUNCTION_NAME:-ecommerce-event-ingestion}
      RAW_BUCKET: ${RAW_BUCKET}
      RAW_BUCKET_NAME: ${RAW_BUCKET_NAME}
      CURATED_BUCKET: ${CURATED_BUCKET}
      GLUE_CRAWLER_NAME: ${GLUE_CRAWLER_NAME}
      GLUE_ETL_JOB: ${GLUE_ETL_JOB}
      GLUE_DQ_JOB: ${GLUE_DQ_JOB}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      retries: 5
    env_file:
      - .env
  
volumes:
  postgres-db-volume:

networks:
  default:
    name: airflow-network

 